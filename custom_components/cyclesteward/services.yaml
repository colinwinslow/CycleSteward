set_mode:
  name: Set charge mode
  description: >
    Set the charge mode for a CycleSteward entry.  Same write path as the
    charge_mode select entity; suitable for automations.
  fields:
    entry_id:
      name: Config entry ID
      description: The config entry to target.
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: "off / charge_to_target / charge_to_full"
      required: true
      selector:
        select:
          options:
            - "off"
            - "charge_to_target"
            - "charge_to_full"

manual_override:
  name: Manual override
  description: >
    Enable or disable manual override.  Same write path as the manual_override
    switch; suitable for automations.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

# start_calibration_session and import_history are intentionally omitted: this
# slice registers only services with a working coordinator path (spec D2).  They
# return with their feature slices so no declared-but-unregistered service ships.

acknowledge_fault:
  name: Acknowledge fault
  description: >
    Clear a non-fatal fault and return to OFF_IDLE.  Same action as the
    acknowledge_fault button; suitable for automations.
  fields:
    entry_id:
      name: Config entry ID
      required: true
      selector:
        text:
